[package]
name = "halo-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Halo Agent and Workflow execution kernel"

[lib]
path = "src/lib.rs"

[dependencies]
futures-core = "0.3"
futures-util = { version = "0.3", features = ["alloc"] }
jsonschema = { version = "0.58.5", default-features = false }
csv = "1.4"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "0.8"
sha2 = "0.10"
rand = "0.10.2"
tokio = { version = "1", features = ["rt", "net", "time", "fs", "io-util", "process", "sync"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }

[dev-dependencies]
futures-executor = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
