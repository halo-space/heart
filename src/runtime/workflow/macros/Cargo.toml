[package]
name = "heart-node-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Compile-time validation for Heart Workflow node registration"

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro-crate = "3"
